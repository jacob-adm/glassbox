name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Hosted runners are not available to this private repository on its current plan,
    # so the jobs run once it is public. Until then ci/linux.sh and the local hooks gate merges.
    if: github.event.repository.visibility == 'public'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
